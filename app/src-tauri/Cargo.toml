[package]
name = "ai-code-companion"
version = "0.1.0"
description = "AI Code Companion — chat with your codebase"
authors = ["AI Code Companion contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
# `staticlib`/`cdylib` are required for the mobile targets; `rlib` lets `main.rs`
# call into the shared entry point.
name = "ai_code_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
