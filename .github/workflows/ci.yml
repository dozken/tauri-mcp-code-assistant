name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The mutation job is gated on this and on a manual run. Without the trigger it
  # was gated on a schedule that did not exist, so it had never run once on its
  # own. Weekly rather than nightly: the run takes tens of minutes, and the thing
  # it catches — a test that stopped testing anything — does not appear overnight.
  schedule:
    - cron: '0 3 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Every job runs fully offline: no Chroma, no LLM, no token delay.
  CHROMA_ENABLED: 'false'
  LLM_PROVIDER: stub
  STUB_TOKEN_DELAY_MS: '0'

jobs:
  check:
    name: Lint, types, dead code, architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # `npm ci` runs the contracts package's `prepare`, so dist/ exists for the
      # workspaces that import it.
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run knip
      - run: npm run deps
      - run: npm run size

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:cov
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: '**/coverage/lcov.info'
          if-no-files-found: ignore

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # e2e/a11y.spec.ts runs axe against the rendered app; jsx-a11y only sees
      # the source, so the two catch different classes of problem.
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: app/playwright-report/
          retention-days: 7

  rust:
    name: Tauri shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libsoup-3.0-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The shell declares the backend executable as a sidecar, and Tauri's build
      # script refuses to run when a declared resource is missing — so even
      # `cargo clippy` needs it on disk. Building it for real rather than touching
      # a placeholder: this is the one job that then proves the packaging script
      # still works, on the commit that changed it rather than at release time.
      - run: npm run package --workspace @ai-code-companion/backend
      - run: npm run rust:fmt
      - run: npm run rust:lint

  mutation:
    name: Mutation testing
    # Minutes, not seconds: nightly and on demand, never blocking a PR.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run mutation
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutation-reports
          path: '**/reports/mutation/**'
          if-no-files-found: ignore
