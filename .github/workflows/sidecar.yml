name: Sidecar

# The desktop bundle carries a single-file Node build of the backend, and until
# now CI only ever *built* it. A binary that compiles and a binary that starts are
# different claims, and nothing here had ever tested the second one — v0.1.0
# shipped a sidecar that `codesign` reports as "not signed at all" and no check
# noticed, because no check ran it.
#
# So this runs it. On every platform the release builds for, the sidecar is
# packaged, executed, and asked for its health endpoint over HTTP — the same
# sequence the desktop shell performs at launch. On macOS it also reads back the
# signature, which is the part that stays quiet when it goes wrong: measured on an
# Apple silicon runner, an unsigned sidecar starts perfectly well (the kernel
# ad-hoc signs it on first execution), so only `codesign --verify` can tell.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/scripts/package.mjs'
      - 'backend/src/main.ts'
      - 'backend/package.json'
      - '.github/workflows/sidecar.yml'
  pull_request:
    paths:
      - 'backend/scripts/package.mjs'
      - 'backend/src/main.ts'
      - 'backend/package.json'
      - '.github/workflows/sidecar.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS (Apple silicon)
          - os: macos-15-intel
            label: macOS (Intel)
          - os: ubuntu-22.04
            label: Linux
          - os: windows-latest
            label: Windows
    env:
      CHROMA_ENABLED: 'false'
      LLM_PROVIDER: stub
      STUB_TOKEN_DELAY_MS: '0'
      HOST: 127.0.0.1
      PORT: '45017'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # Only for `rustc -vV`: the sidecar is named by the host target triple,
      # because that is the name Tauri will look it up under.
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci

      - name: Package the backend as a sidecar
        run: npm run package --workspace @ai-code-companion/backend

      - name: Read the signature macOS will read
        if: runner.os == 'macOS'
        shell: bash
        run: |
          sidecar=$(ls backend/dist-bin/companion-backend-*)
          codesign --display --verbose=4 "$sidecar"
          codesign --verify --strict --verbose=2 "$sidecar"

      # The claim under test: this file, run as a program, serves HTTP. `/health`
      # is the one unauthenticated route, so a reply proves the binary executed,
      # Nest booted and the port is open — without a token to arrange.
      - name: Start it, and ask it for a health check
        shell: bash
        run: |
          set -euo pipefail
          sidecar=$(ls backend/dist-bin/companion-backend-*)
          "./$sidecar" > sidecar.log 2>&1 &
          pid=$!

          for _ in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:${PORT}/health" -o health.json; then break; fi
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "The sidecar exited before it ever listened."
              break
            fi
            sleep 1
          done

          kill "$pid" 2>/dev/null || true

          echo '--- what it logged ---'
          cat sidecar.log || true
          echo '--- what it answered ---'
          cat health.json || true
          echo

          grep -q '"status":"ok"' health.json
