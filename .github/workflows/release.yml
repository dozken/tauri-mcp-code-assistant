name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (defaults to the current ref)'
        required: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # The gate runs on every push already, but a tag can be pushed to any commit —
  # including one that never saw CI. A release that skips the checks is how a
  # broken build reaches users with a version number attached.
  verify:
    name: Gate
    runs-on: ubuntu-latest
    env:
      CHROMA_ENABLED: 'false'
      LLM_PROVIDER: stub
      STUB_TOKEN_DELAY_MS: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  bundle:
    name: ${{ matrix.label }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # One job per macOS architecture rather than a universal bundle. The
          # sidecar is a copy of the build machine's own `node` with a blob
          # injected into it, so it can only ever be the architecture it was built
          # on — a universal bundle would need an x86_64 Node produced on an arm64
          # runner, which is a cross-build nobody here can test. Two native
          # bundles, each carrying a runtime that actually runs.
          - os: macos-latest
            label: macOS (Apple silicon)
          - os: macos-15-intel
            label: macOS (Intel)
          - os: ubuntu-22.04
            label: Linux (deb, rpm, AppImage)
          - os: windows-latest
            label: Windows (msi, nsis)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: Install Tauri system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libsoup-3.0-dev
      - run: npm ci

      # Built on each runner rather than once and copied: the sidecar embeds that
      # machine's Node, and Tauri looks it up by the host target triple.
      - name: Package the backend as a sidecar
        run: npm run package --workspace @ai-code-companion/backend

      # An absent secret is an empty string, not an absent variable, and Tauri reads
      # a defined `APPLE_CERTIFICATE` as "sign with this" — so handing the group to
      # the bundler unconditionally turns *no* certificate into `security import:
      # failed to import keychain certificate` and a failed release. The first run
      # of this workflow died exactly there. Exporting the group only when there is
      # a certificate is what makes "every signing secret is optional" true.
      - name: Enable Apple signing, when the certificates are configured
        if: startsWith(matrix.os, 'macos')
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "No Apple certificate configured; this bundle will be unsigned."
            exit 0
          fi
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                      APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            printf '%s<<COMPANION_SECRET_EOF\n%s\nCOMPANION_SECRET_EOF\n' "$name" "${!name}"
          done >> "$GITHUB_ENV"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No `TAURI_SIGNING_PRIVATE_KEY`: nothing here produces updater artefacts
          # to sign. Passing a key that signs nothing reads like the updater works.
          # The Apple variables arrive from the step above, or not at all.
        with:
          projectPath: app
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: AI Code Companion ${{ inputs.tag || github.ref_name }}
          # Draft, so a human reads the notes and checks the artefacts before
          # anyone downloads them.
          releaseDraft: true
          prerelease: false
          releaseBody: |
            The bundle carries its own backend and starts it on launch — nothing
            to install, no Node on the machine. Point the window at a backend you
            are already running with `COMPANION_BACKEND_URL`.
